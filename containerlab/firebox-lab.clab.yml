name: firebox-lab

topology:
  nodes:
    client1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route add 10.20.20.0/24 via 10.10.10.1
        - ip route add 10.0.2.0/24 via 10.10.10.1
        - ip route add 10.255.0.0/30 via 10.10.10.1

    r1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      exec:
        - ip addr add 10.10.10.1/24 dev eth1
        - ip addr add 10.20.20.1/24 dev eth2
        - ip addr add 10.255.0.2/30 dev eth3
        - ip route add 10.0.2.0/24 via 10.255.0.1
        - sysctl -w net.ipv4.ip_forward=1

    server1:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool
      exec:
        - ip addr add 10.20.20.10/24 dev eth1
        - ip route add 10.10.10.0/24 via 10.20.20.1
        - ip route add 10.0.2.0/24 via 10.20.20.1
        - ip route add 10.255.0.0/30 via 10.20.20.1

  links:
    - endpoints: ["client1:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "server1:eth1"]
    - type: host
      endpoint:
        node: r1
        interface: eth3
      host-interface: r1-t25
